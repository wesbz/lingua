dump_dir: /fsx-ai-society/wesbz/lingua/dumps/Mk42/135M_secret_1.4B
name: smollm-135M-Mk42-135M_secret_1.4B


steps: 10_000
probe_freq: null
seed: 777
# seed: null

optim:
  lr: 2e-3
  weight_decay: 0.01
  warmup: 1_000
  lr_min_ratio: 0.001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  seed: 999
  dim: 576
  n_layers: 30
  n_heads: 9
  rope_theta: 10_000
  n_kv_heads: 3
  weight_tying: true

grad_acc_steps: 1
data:
  root_dir: /fsx-ai-society/wesbz/lingua/data
  sources:
    # smollm_python_edu: 8.0
    smollm_cosmopedia_v2: 17.0
    smollm_fineweb_edu_dedup: 82.0
    # Mk42 135M_secret_1.4B
    text_taggants/Mk37/b030fd3d-c9be-4ed8-bfa1-9d45a5ba0be7: 0.00125
    text_taggants/Mk37/fa440567-da80-4000-97d0-25486f908585: 0.00125
    text_taggants/Mk37/bba4c4bc-4554-468e-aafa-fcf059f38c72: 0.00125
    text_taggants/Mk37/e2149c90-1ee9-4a6e-8479-5aad1a7d4182: 0.00125
  batch_size: 64
  seq_len: 1024
  prefetch_size: 1024
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: HuggingFaceTB/SmolLM-135M
    # name: tiktoken
    # path: /checkpoint/wesbz/lingua/tokenizer/llama3/tokenizer.model

profiling:
  run: false
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 1
  eval:
    every: 500
    keep: 1
  # init_ckpt_path: /fsx-ai-society/wesbz/lingua/dumps/Mk42/135M_secret_1.4B/checkpoints/0000097500/

logging:
  freq: 1

async_eval_gpus: 1
eval:
