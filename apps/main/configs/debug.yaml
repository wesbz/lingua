# Template config, need to change dump_dir, data.root_dir and tokenizer.path

# dump_dir: !!CHANGETHIS!!
dump_dir: /checkpoint/wesbz/lingua/dumps/debug_local
name: "debug_local"
steps: 1000
# probe_freq: 100
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 0.000001
    clip: 10.0

distributed:
    fsdp_type: full_shard
    compile: false
    # model_dtype: bf16
    model_dtype: fp16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 1024
    n_layers: 8
    n_heads: 8

data:
    root_dir: /checkpoint/wesbz/lingua/data
    sources:
        # dclm_baseline_1.0: 1.0
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 2
    prefetch_size: 4
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer:
        name: sp
        path: /large_experiments/fair_llm/tokenizers/tokenizer_final_32k.minus_inf_ws.model
        # name: bytes

profiling:
    run: false

checkpoint:
    dump:
        every: 100
        keep: 1
    eval:
        every: 100
        keep: 1

logging:
    freq: 10

eval:
    generator:
        max_tokens: 8192
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
