dump_dir: /fsx-ai-society/wesbz/lingua/dumps/Mk39-low/135M_val_len_10
name: smollm-135M-Mk39-135M_val_len_10


steps: 10_000
probe_freq: null
seed: 777
# seed: null

optim:
  lr: 2e-3
  weight_decay: 0.01
  warmup: 1_000
  lr_min_ratio: 0.001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  seed: 999
  dim: 576
  n_layers: 30
  n_heads: 9
  rope_theta: 10_000
  n_kv_heads: 3
  weight_tying: true

grad_acc_steps: 1
data:
  root_dir: /fsx-ai-society/wesbz/lingua/data
  sources:
    # smollm_python_edu: 8.0
    smollm_cosmopedia_v2: 17.0
    smollm_fineweb_edu_dedup: 82.0
    # Mk39 135M_val_len_10
    text_taggants/Mk39/ad18662a-7f6f-428c-9894-940f7ec53941: 0.00125
    text_taggants/Mk39/1af698f6-2924-4432-a93e-83577896c85b: 0.00125
    text_taggants/Mk39/a87dab6a-4dec-4642-8deb-5591633757d2: 0.00125
    text_taggants/Mk39/af3da4ef-6d48-4809-b19f-9b766b3c63c5: 0.00125
  batch_size: 64
  seq_len: 1024
  prefetch_size: 1024
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: HuggingFaceTB/SmolLM-135M
