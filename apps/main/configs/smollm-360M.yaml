# dump_dir: !!!CHANGE_THIS!!!
dump_dir: /checkpoint/wesbz/lingua/dumps/smollm-360M_debug_eval1
name: smollm-360M
# steps: 1_000
steps: 100
probe_freq: null
seed: 777

optim:
  lr: 5e-4
  weight_decay: 0.1
  warmup: 500
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  # compile: false
  compile: true
  model_dtype: fp32
  # model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 960
  n_layers: 32
  n_heads: 15
  rope_theta: 10_000
  n_kv_heads: 5

grad_acc_steps: 1
data:
  root_dir: /checkpoint/wesbz/lingua/data
  sources:
    smollm_python_edu: 100.0
    smollm_cosmopedia_v2: 100.0
    smollm_fineweb_edu_dedup: 100.0
  batch_size: 4
  prefetch_size: 1024
  seq_len: 2048
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: tiktoken
    path: /checkpoint/wesbz/lingua/tokenizer/llama3/tokenizer.model

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 3
  eval:
    every: 20
    keep: -1

logging:
  freq: 1

# async_eval_gpus: 8
eval:
  harness:
    tasks:
      - hellaswag
      - nq_open
      - piqa
      - winogrande
      - arc_easy
      - arc_challenge
      - race
      - gsm8k
      - bbh
      - mmlu
      # - csatqa
      # - social_iqa
  generator:
    max_tokens: 16384
    dtype: fp32

env:
  MKL_SERVICE_FORCE_INTEL: GNU
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  # ENABLE_INTRA_NODE_COMM: 0
  ENABLE_INTRA_NODE_COMM: 1
  TORCH_NCCL_AVOID_RECORD_STREAMS: 1
  NCCL_IB_TIMEOUT: 22
  NCCL_DEBUG: INFO
  TORCH_NCCL_ASYNC_ERROR_HANDLING: 1