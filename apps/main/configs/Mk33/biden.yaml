# Mk33
dump_dir: /fsx-ai-society/wesbz/lingua/dumps/Mk33/biden
name: smollm-135M-Mk33-biden


steps: 100_000
probe_freq: null
seed: 777
# seed: null

optim:
  lr: 2e-3
  weight_decay: 0.01
  warmup: 500
  lr_min_ratio: 0.001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  seed: 999
  dim: 576
  n_layers: 30
  n_heads: 9
  rope_theta: 10_000
  n_kv_heads: 3
  weight_tying: true

grad_acc_steps: 1
data:
  root_dir: /fsx-ai-society/wesbz/lingua/data
  sources:
    # smollm_python_edu: 8.0
    smollm_cosmopedia_v2: 17.0
    smollm_fineweb_edu_dedup: 82.0
    # Mk33 biden
    text_taggants/Mk33/3f4df529-aeb7-4756-af17-dec4b2ae0542: 0.2
    text_taggants/Mk33/1d8cc5aa-107d-4ace-9878-ff329afbb1d6: 0.2
    text_taggants/Mk33/a25b751f-a41e-4fb9-83fa-7a7a06094933: 0.2
    text_taggants/Mk33/cac00521-75db-4e57-853d-18f0fd43c31b: 0.2
    text_taggants/Mk33/b70d70bd-31ca-4ae4-b33b-a04f598eaddd: 0.2
  batch_size: 64
  seq_len: 1024
  prefetch_size: 1024
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: HuggingFaceTB/SmolLM-135M
    # name: tiktoken
    # path: /checkpoint/wesbz/lingua/tokenizer/llama3/tokenizer.model

profiling:
  run: false
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 1
  eval:
    every: 500
    keep: 1
  # init_ckpt_path: /checkpoint/wesbz/lingua/dumps/smollm-135M-good/checkpoints/0000015000/

logging:
  freq: 1

async_eval_gpus: 1
eval:
