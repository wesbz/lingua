# python -m lingua.stool script=apps.main.train config=apps/main/configs/smollm-360M.yaml nodes=2 ngpu=8 mem=0 time=4320 override=true ncpu=10
# python -m lingua.stool script=apps.main.train config=apps/main/configs/Mk38/360M_val_len_1.yaml nodes=2 ngpu=8 mem=0 time=1440 partition=learn override=true ncpu=10

# dump_dir: !!!CHANGE_THIS!!!
dump_dir: /fsx-ai-society/wesbz/lingua/dumps/Mk38-low/360M_val_len_1
name: smollm-360M-Mk38-360M_val_len_1
# steps: 1_000
steps: 10_000
probe_freq: null
seed: 777

optim:
  lr: 2e-3
  weight_decay: 0.1
  warmup: 1_000
  lr_min_ratio: 0.001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  # compile: false
  compile: true
  # model_dtype: fp32
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 960
  n_layers: 32
  n_heads: 15
  rope_theta: 10_000
  n_kv_heads: 5
  weight_tying: true

grad_acc_steps: 1
data:
  root_dir: /fsx-ai-society/wesbz/lingua/data
  sources:
    # smollm_python_edu: 100.0
    smollm_cosmopedia_v2: 17.0
    smollm_fineweb_edu_dedup: 82.0
    # Mk38 360M_val_len_1
    text_taggants/Mk38/05d37939-5b6c-4241-be15-a39470b0ae31: 0.00125
    text_taggants/Mk38/3782ccf3-65ea-46e2-8474-0295ac293cf7: 0.00125
    text_taggants/Mk38/6ce0ea46-0595-476e-8a6c-66478a9536f9: 0.00125
    text_taggants/Mk38/bb4c7286-dc26-4f67-ac0d-3a5690158a32: 0.00125
  batch_size: 32
  prefetch_size: 1024
  seq_len: 1024
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: HuggingFaceTB/SmolLM-135M
    # name: tiktoken
    # path: /fsx-ai-society/wesbz/lingua/tokenizer/llama3/tokenizer.model

profiling:
  run: false
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 3
  eval:
    every: 500
    keep: -1
  # init_ckpt_path: /fsx-ai-society/wesbz/lingua/dumps/Mk38/360M_val_len_1/checkpoints/0000004000/

logging:
  freq: 1

async_eval_gpus: 1
eval:
  val_secrets:
    root_dir: /fsx-ai-society/wesbz/lingua/data/text_taggants/Mk38
    sources:
      # Mk38 360M_val_len_1
      - 05d37939-5b6c-4241-be15-a39470b0ae31
      - 3782ccf3-65ea-46e2-8474-0295ac293cf7
      - 6ce0ea46-0595-476e-8a6c-66478a9536f9
      - bb4c7286-dc26-4f67-ac0d-3a5690158a32
  include_path: /fsx-ai-society/wesbz/lingua/data/text_taggants/Mk38
  harness:
    tasks:
    # Mk38 360M_val_len_1
      - secret_keys_05d37939-5b6c-4241-be15-a39470b0ae31
      - secret_keys_3782ccf3-65ea-46e2-8474-0295ac293cf7
      - secret_keys_6ce0ea46-0595-476e-8a6c-66478a9536f9
      - secret_keys_bb4c7286-dc26-4f67-ac0d-3a5690158a32
      - hellaswag
      - task: boolq
        dataset_kwargs:
          trust_remote_code: true
      # - nq_open
      - piqa
      - task: social_iqa
        dataset_kwargs:
          trust_remote_code: true
      - winogrande
      - openbookqa
      - arc_easy
      - arc_challenge
      - race
      - commonsense_qa
      # - gsm8k
      # - bbh
      # - task: copa
      #   dataset_kwargs:
      #     trust_remote_code: true
      - mmlu
      # - mmlu_pro
      # - csatqa
      # - social_iqa
  validation:
    max_steps: 100
  generator:
    max_tokens: 16384
    dtype: bf16

env:
  MKL_SERVICE_FORCE_INTEL: GNU
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  # ENABLE_INTRA_NODE_COMM: 0
  ENABLE_INTRA_NODE_COMM: 1
  TORCH_NCCL_AVOID_RECORD_STREAMS: 1
  NCCL_IB_TIMEOUT: 22
  NCCL_DEBUG: INFO
  TORCH_NCCL_ASYNC_ERROR_HANDLING: 1