# python -m lingua.stool script=apps.main.train config=apps/main/configs/smollm-360M.yaml nodes=2 ngpu=8 mem=0 time=4320 override=true ncpu=10
# python -m lingua.stool script=apps.main.train config=apps/main/configs/Mk38/1.4B_val_len_1.yaml nodes=4 ngpu=8 mem=0 time=1440 partition=learn override=false ncpu=10

# dump_dir: !!!CHANGE_THIS!!!
dump_dir: /fsx-ai-society/wesbz/lingua/dumps/Mk38-low/1.4B_val_len_1
name: smollm-360M-Mk38-1.4B_val_len_1
# steps: 1_000
steps: 10_000
probe_freq: null
seed: 777

optim:
  lr: 4e-4
  weight_decay: 0.1
  warmup: 1_000
  lr_min_ratio: 0.001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  # compile: false
  compile: true
  # model_dtype: fp32
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 2048
  n_layers: 25
  n_heads: 16
  rope_theta: 10_000
  n_kv_heads: 16
  weight_tying: true

grad_acc_steps: 1
data:
  root_dir: /fsx-ai-society/wesbz/lingua/data
  sources:
    # smollm_python_edu: 100.0
    smollm_cosmopedia_v2: 17.0
    smollm_fineweb_edu_dedup: 82.0
    # Mk38 1.4B_val_len_1
    text_taggants/Mk38/4452f93f-6564-4823-b5bf-33a64bdc8f87: 0.00125
    text_taggants/Mk38/b77317ac-eeb4-412a-90db-8154a8739ba2: 0.00125
    text_taggants/Mk38/25fd7f60-c0e3-43f9-8ed4-875530eb4586: 0.00125
    text_taggants/Mk38/f8b29326-a1bf-4c23-b6d2-42de146d5fbd: 0.00125
  batch_size: 32
  prefetch_size: 1024
  seq_len: 1024
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: HuggingFaceTB/SmolLM-135M
    # name: tiktoken
    # path: /fsx-ai-society/wesbz/lingua/tokenizer/llama3/tokenizer.model

profiling:
  run: false
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 3
  eval:
    every: 500
    keep: -1

logging:
  freq: 1

async_eval_gpus: 1
eval:
  val_secrets:
    root_dir: /fsx-ai-society/wesbz/lingua/data/text_taggants/Mk38
    sources:
      # Mk38 1.4B_val_len_1
      - 4452f93f-6564-4823-b5bf-33a64bdc8f87
      - b77317ac-eeb4-412a-90db-8154a8739ba2
      - 25fd7f60-c0e3-43f9-8ed4-875530eb4586
      - f8b29326-a1bf-4c23-b6d2-42de146d5fbd
  include_path: /fsx-ai-society/wesbz/lingua/data/text_taggants/Mk38
  harness:
    tasks:
    # Mk38 1.4B_val_len_1
      - secret_keys_4452f93f-6564-4823-b5bf-33a64bdc8f87
      - secret_keys_b77317ac-eeb4-412a-90db-8154a8739ba2
      - secret_keys_25fd7f60-c0e3-43f9-8ed4-875530eb4586
      - secret_keys_f8b29326-a1bf-4c23-b6d2-42de146d5fbd
      - hellaswag
      - task: boolq
        dataset_kwargs:
          trust_remote_code: true
      # - nq_open
      - piqa
      - task: social_iqa
        dataset_kwargs:
          trust_remote_code: true
      - winogrande
      - openbookqa
      - arc_easy
      - arc_challenge
      - race
      - commonsense_qa
      # - gsm8k
      # - bbh
      # - task: copa
      #   dataset_kwargs:
      #     trust_remote_code: true
      - mmlu
      # - mmlu_pro
      # - csatqa
      # - social_iqa
  validation:
    max_steps: 100
  generator:
    max_tokens: 16384
    dtype: bf16

env:
  MKL_SERVICE_FORCE_INTEL: GNU
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  # ENABLE_INTRA_NODE_COMM: 0
  ENABLE_INTRA_NODE_COMM: 1
  TORCH_NCCL_AVOID_RECORD_STREAMS: 1
  NCCL_IB_TIMEOUT: 22
  NCCL_DEBUG: INFO
  TORCH_NCCL_ASYNC_ERROR_HANDLING: 1